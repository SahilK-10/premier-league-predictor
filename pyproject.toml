[project]
name = "premier-league-predictor"
version = "0.1.0"
description = "End-to-end Premier League match prediction system using Poisson/Dixon-Coles, XGBoost, SHAP, FastAPI, Reflex, and Supabase."
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "apscheduler>=3.10.4",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "lxml>=5.3.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "reflex>=0.7.0",
    "requests>=2.32.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "shap>=0.46.0",
    "sqlalchemy>=2.0.0",
    "supabase>=2.9.0",
    "uvicorn[standard]>=0.30.0",
    "xgboost>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "models", "data", "clean", "features", "ingest"]
