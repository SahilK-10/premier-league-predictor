[project]
name = "premier-league-predictor"
version = "0.1.0"
description = "Premier League match prediction system using a Poisson/Dixon-Coles model with Supabase-backed data pipelines."
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.141.1",
    "httpx>=0.27.0",
    "lxml>=5.3.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "scipy>=1.13.0",
    "supabase>=2.9.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models", "data", "clean", "features", "ingest"]
